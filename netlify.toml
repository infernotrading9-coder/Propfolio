[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/google"
  to = "/.netlify/functions/auth-google"
  status = 200

[[redirects]]
  from = "/api/user/data"
  to = "/.netlify/functions/db-state"
  status = 200

[[redirects]]
  from = "/api/firms"
  to = "/.netlify/functions/db-firms"
  status = 200

[[redirects]]
  from = "/api/challenges"
  to = "/.netlify/functions/db-challenges"
  status = 200

[[redirects]]
  from = "/api/user/selected-firm"
  to = "/.netlify/functions/db-user"
  status = 200

[[redirects]]
  from = "/api/payouts"
  to = "/.netlify/functions/db-payouts"
  status = 200

[[redirects]]
  from = "/api/mark-phase"
  to = "/.netlify/functions/db-phase"
  status = 200

[[redirects]]
  from = "/api/challenges/bulk-status"
  to = "/.netlify/functions/db-bulk"
  status = 200

# Catchall must be LAST so API routes match first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Allow Netlify Identity iframe endpoints to load inside frames
[[headers]]
  for = "/.netlify/identity/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "unsafe-none"

# Disable caching for API and Functions to avoid stale HTML
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
